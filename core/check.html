<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .hero-sections {
            background: #f5f5f5;
            padding: 50px 0;
            text-align: center;
        }

        .hero-sections h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        .tab-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .tab-btn {
            background: #eee;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #007bff;
            color: #fff;
        }

        .tab-btn:hover {
            background: #ddd;
        }

        .gallery {
            background-color: #fff;
            padding: 50px 0;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            transition: transform 0.3s ease;
        }

        .gallery-item img:hover {
            transform: scale(1.03);
        }

        .gallery-item h3 {
            font-size: 1rem;
            margin-top: 10px;
            font-weight: 600;
            text-align: center;
        }

        .gallery-item.hide {
            display: none !important;
        }

        .gallery-item {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

<!-- Hero Section -->
<div class="hero-sections">
    <h1>Gallery</h1>
</div>

<!-- Tabs -->
<div class="tab-navigation">
    <div class="tab-buttons">
        <button class="tab-btn active" data-title="all">All</button>
        <button class="tab-btn" data-title="nature">Nature</button>
        <button class="tab-btn" data-title="technology">Technology</button>
        <button class="tab-btn" data-title="people">People</button>
    </div>
</div>

<!-- Gallery -->
<section id="partners" class="gallery">
    <div class="gallery-grid">
        <div class="gallery-item" data-title="nature">
            <img src="https://via.placeholder.com/400x250?text=Nature+1" alt="Nature 1">
            <h3>Nature 1</h3>
        </div>
        <div class="gallery-item" data-title="technology">
            <img src="https://via.placeholder.com/400x250?text=Technology+1" alt="Technology 1">
            <h3>Technology 1</h3>
        </div>
        <div class="gallery-item" data-title="people">
            <img src="https://via.placeholder.com/400x250?text=People+1" alt="People 1">
            <h3>People 1</h3>
        </div>
        <div class="gallery-item" data-title="nature">
            <img src="https://via.placeholder.com/400x250?text=Nature+2" alt="Nature 2">
            <h3>Nature 2</h3>
        </div>
        <div class="gallery-item" data-title="technology">
            <img src="https://via.placeholder.com/400x250?text=Technology+2" alt="Technology 2">
            <h3>Technology 2</h3>
        </div>
        <div class="gallery-item" data-title="people">
            <img src="https://via.placeholder.com/400x250?text=People+2" alt="People 2">
            <h3>People 2</h3>
        </div>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const tabs = document.querySelectorAll('.tab-btn');
    const items = document.querySelectorAll('.gallery-item');

    function showItems(selected) {
        items.forEach(item => {
            if (selected === 'all' || item.dataset.title === selected) {
                item.classList.remove('hide');
            } else {
                item.classList.add('hide');
            }
        });
    }

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');

            const selectedTitle = tab.dataset.title;
            showItems(selectedTitle);
        });
    });

    // Show all items by default
    showItems('all');
});
</script>

</body>
</html>
